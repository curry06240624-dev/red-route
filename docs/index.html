<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Route · Marswalk planner</title>
<meta name="description" content="Plan a Marswalk in Jezero Crater and check, at every step, that the crew can still get home. Built on NASA, USGS and ESA data.">
<link rel="icon" type="image/png" href="favicon_64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="map" aria-label="Map of Jezero Crater, Mars"></div>

<header class="brand pnl">
  <div class="badge-wrap">
    <img src="badge_88.png" srcset="badge_176.png 2x" alt="Red Route mission badge (AI-generated image)" width="46" height="46">
  </div>
  <div class="brand-name">RED ROUTE</div>
  <div class="brand-sub"><span class="t">MARSWALK PLANNER<br>JEZERO CRATER, MARS</span><span class="ai-tag">BADGE: AI-GENERATED IMAGE</span></div>
</header>

<nav class="topnav pnl" aria-label="Panels">
  <button data-open="layersPanel">LAYERS</button>
  <button data-open="planPanel">PLAN YOUR EVA</button>
  <button data-open="about">HOW IT WORKS</button>
</nav>

<aside class="pnl left" id="left">
  <section id="checks"></section>
  <section id="stopList"></section>
  <section id="conditions"></section>
</aside>

<aside class="pnl right" id="right"></aside>

<div class="pnl live" id="live" hidden></div>
<div class="pnl legend" id="legend"></div>

<div class="pnl drawer" id="layersPanel" hidden></div>
<div class="pnl drawer" id="planPanel" hidden></div>

<footer class="pnl timeline" id="timeline">
  <button class="play" id="playBtn" aria-label="Play the EVA"><span class="tri"></span></button>
  <div class="tl-wrap"><svg id="tlSvg" aria-label="EVA timeline and elevation profile"></svg><div class="tl-tip" id="tlTip" hidden></div></div>
</footer>

<div class="modal" id="about" hidden>
  <div class="modal-body pnl">
    <button class="x" data-close="about" aria-label="Close">&times;</button>
    <div id="aboutBody"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="x" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous photo">&lsaquo;</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-nav next" id="lbNext" aria-label="Next photo">&rsaquo;</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
